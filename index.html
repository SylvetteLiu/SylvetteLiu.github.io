    <script>
      // Self-healing against stale service-worker shells. Runs as a classic
      // inline script so it works even if the module bundle fails to load
      // (the cause of a white screen after a deploy). When a NEW service worker
      // takes control, reload once to pick up matching, non-404 assets.
      (function () {
        if (!("serviceWorker" in navigator)) return;
        var had = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (!had) { had = true; return; }
          window.location.reload();
        });
      })();
    </script>
